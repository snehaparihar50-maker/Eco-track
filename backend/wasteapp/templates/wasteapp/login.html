<!DOCTYPE html>
<html>
<head>
    <title>Eco Track - Login</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f8f4;
        }

        .navbar {
            background: #2e7d32;
            color: white;
            padding: 18px 50px;
        }

        .navbar h2 {
            margin: 0;
        }

        .container {
            width: 350px;
            margin: 70px auto;
            background: white;
            padding: 35px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            color: #2e7d32;
        }

        label {
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0 18px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #2e7d32;
            color: white;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1b5e20;
        }

        .error {
            color: red;
            text-align: center;
            margin-bottom: 15px;
        }

        .back {
            text-align: center;
            margin-top: 20px;
        }

        .back a {
            color: #2e7d32;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="navbar">
        <h2>🌱 Eco Track</h2>
    </div>

    <div class="container">

        <h1>🔐 Login</h1>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <label>Username</label>
            <input type="text" name="username" placeholder="Enter username" required>

            <label>Password</label>
            <input type="password" name="password" placeholder="Enter password" required>

            <button type="submit">Login</button>
        </form>

        <div class="back">
            <a href="/">← Back to Home</a>
        </div>

    </div>

</body>
</html>
